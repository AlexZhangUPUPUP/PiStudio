name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The frontend build and the headless-Chrome smoke test never use Electron,
  # so skip its ~100 MB binary download. Point npm at GitHub (not the China
  # mirror in .npmrc) since that is what the runners can reach.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  build:
    name: typecheck & build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  smoke:
    name: UI smoke test (headless Chrome)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The server spawns `pi --mode rpc`; install the real CLI so the smoke
      # test exercises the same path a user would.
      - run: npm install -g @earendil-works/pi-coding-agent
      - name: Run smoke test
        run: npm run test:quick
        env:
          CHROME_BIN: /usr/bin/google-chrome
