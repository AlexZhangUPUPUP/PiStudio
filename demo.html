<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Demo · 现代化页面</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #22d3ee;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* 背景光晕 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(
          circle at 20% 20%,
          rgba(99, 102, 241, 0.25),
          transparent 45%
        ),
        radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.2), transparent 45%);
      z-index: -1;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: fadeUp 0.7s ease both;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      background: linear-gradient(120deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    #output {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: var(--accent);
      min-height: 1.5em;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, Pi ✨</h1>
    <p>
      这是一个响应式的现代化 HTML 示例页面，包含渐变文字、光晕背景、
      按钮交互动效和简单的 JavaScript 逻辑。
    </p>
    <button class="btn" id="actionBtn">点我试试</button>
    <div id="output"></div>
  </main>

  <script>
    const btn = document.getElementById("actionBtn");
    const output = document.getElementById("output");
    let count = 0;

    btn.addEventListener("click", () => {
      count++;
      output.textContent = `你已经点击了 ${count} 次 🎉`;
    });
  </script>
</body>
</html>
